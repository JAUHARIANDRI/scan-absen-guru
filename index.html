
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan Absensi Guru ASSIDKI</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .container {
      max-width: 480px;
      margin: 20px auto;
      padding: 24px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 24px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 23px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin-bottom: 24px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    .status {
      padding: 14px;
      margin: 18px 0;
      background: #f1f5f9;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .result {
      padding: 16px;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 10px;
      text-align: center;
      display: none;
    }

    .nip {
      font-size: 22px;
      font-weight: bold;
      margin: 8px 0;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .btn-start {
      background: #2563eb;
      color: white;
    }

    .btn-stop {
      background: #e2e8f0;
      color: #1e293b;
    }

    .note {
      color: #64748b;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>📷 Absensi Guru</h1>
    <p class="subtitle">ASSIDKI · SMP IT &amp; SMA IT</p>

    <div id="reader"></div>

    <div id="status" class="status" role="status" aria-live="polite">
      Tekan tombol Mulai Scan untuk mengaktifkan kamera.
    </div>

    <div id="result" class="result">
      <div>QR Code berhasil dibaca</div>
      <div id="hasilNip" class="nip"></div>
      <div>Menunggu hasil validasi absensi.</div>
    </div>

    <button id="btnMulai" class="btn-start" type="button">
      📷 Mulai Scan
    </button>

    <button id="btnBerhenti" class="btn-stop" type="button" disabled>
      Hentikan Kamera
    </button>

    <p class="note">
      Scan QR Code yang berisi NIP guru, misalnya xxx xxx x.
      Sistem akan meminta lokasi GPS dan mengirim data ke aplikasi
      absensi untuk divalidasi.
    </p>
  </main>

<script>
  let pemindai = null;
  let sedangScan = false;
  let sedangMemproses = false;

  const statusEl = document.getElementById("status");
  const hasilEl = document.getElementById("result");
  const nipEl = document.getElementById("hasilNip");
  const btnMulai = document.getElementById("btnMulai");
  const btnBerhenti = document.getElementById("btnBerhenti");

  // Memulai kamera dan membaca QR Code.
  async function mulaiScan() {
    if (sedangScan || sedangMemproses) return;

    if (typeof Html5Qrcode === "undefined") {
      statusEl.textContent =
        "Library QR belum dimuat. Periksa koneksi internet lalu muat ulang.";
      return;
    }

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      statusEl.textContent =
        "Browser tidak mendukung kamera. Buka website melalui HTTPS.";
      return;
    }

    sedangMemproses = true;
    btnMulai.disabled = true;
    btnBerhenti.disabled = true;
    hasilEl.style.display = "none";
    statusEl.textContent = "Memulai kamera...";

    try {
      if (!pemindai) {
        pemindai = new Html5Qrcode("reader");
      }

      await pemindai.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: { width: 230, height: 230 }
        },
        async function(teks) {
          if (!sedangScan || sedangMemproses) return;

          sedangScan = false;
          sedangMemproses = true;
          btnMulai.disabled = true;
          btnBerhenti.disabled = true;

          const nip = String(teks || "").trim();

          nipEl.textContent = nip;
          hasilEl.style.display = "block";
          statusEl.textContent =
            "QR terbaca. Menghentikan kamera...";

          await hentikanScan();

          btnMulai.textContent = "Scan Lagi";

          kirimNipKeAplikasi(nip);
        }
      );

      sedangScan = true;
      sedangMemproses = false;
      btnMulai.disabled = false;
      btnBerhenti.disabled = false;

      statusEl.textContent =
        "Kamera aktif. Arahkan ke QR Code guru.";

    } catch (error) {
      console.error("Gagal memulai scan:", error);

      statusEl.textContent =
        "Gagal membuka kamera: " +
        (error.message || String(error));

      sedangScan = false;
      sedangMemproses = false;

      if (pemindai) {
        try {
          await pemindai.clear();
        } catch (_) {}

        pemindai = null;
      }

      btnMulai.disabled = false;
      btnBerhenti.disabled = true;
    }
  }

  // Menghentikan kamera.
  async function hentikanScan() {
    sedangScan = false;
    btnBerhenti.disabled = true;

    if (!pemindai) return;

    const scanner = pemindai;
    pemindai = null;

    try {
      await scanner.stop();
    } catch (error) {
      console.log("Penghentian kamera:", error);
    }

    try {
      await scanner.clear();
    } catch (error) {
      console.log("Pembersihan pemindai:", error);
    }
  }

  // Meminta GPS lalu mengirim NIP dan koordinat ke aplikasi.
  function kirimNipKeAplikasi(nip) {
    if (!window.opener || window.opener.closed) {
      statusEl.textContent =
        "Tab aplikasi absensi tidak ditemukan. " +
        "Buka scanner melalui tombol Scan Absen Guru pada aplikasi.";
      sedangMemproses = false;
      btnMulai.disabled = false;
      return;
    }

    if (!navigator.geolocation) {
      statusEl.textContent =
        "Browser tidak mendukung pemeriksaan lokasi GPS.";
      sedangMemproses = false;
      btnMulai.disabled = false;
      return;
    }

    statusEl.textContent = "Memeriksa izin dan lokasi GPS...";

    navigator.geolocation.getCurrentPosition(
      function(posisi) {
        statusEl.textContent =
          "Lokasi diperoleh. Mengirim data absensi...";

        window.opener.postMessage({
          tipe: "PROSES_ABSEN_GURU_QR",
          nip: nip,
          latitude: posisi.coords.latitude,
          longitude: posisi.coords.longitude
        }, "*");
      },
      function(error) {
        let pesan = "Lokasi GPS tidak dapat diperoleh.";

        if (error.code === 1) {
          pesan = "Izin lokasi ditolak. Izinkan akses lokasi pada browser.";
        } else if (error.code === 2) {
          pesan = "Lokasi tidak tersedia. Periksa GPS atau koneksi.";
        } else if (error.code === 3) {
          pesan = "Pemeriksaan lokasi melewati batas waktu. Coba kembali.";
        }

        statusEl.textContent = pesan;
        sedangMemproses = false;
        btnMulai.disabled = false;
      },
      {
        enableHighAccuracy: true,
        timeout: 20000,
        maximumAge: 0
      }
    );
  }

  // Menerima hasil validasi dari aplikasi Apps Script.
  window.addEventListener("message", function(event) {
    if (event.source !== window.opener) return;

    const data = event.data;

    if (!data || data.tipe !== "HASIL_ABSEN_GURU_QR") return;

    sedangMemproses = false;
    btnMulai.disabled = false;
    btnBerhenti.disabled = true;

    if (data.berhasil) {
      hasilEl.style.display = "block";

      const pesanBerhasil =
        (data.pesan || "Absensi berhasil.") +
        " Nama: " + (data.nama || "-") +
        ". Tindakan: " + (data.tindakan || "-") +
        ". Jam: " + (data.jam || "-") +
        ". Jarak: " + (data.jarak ?? "-") + " meter.";

      statusEl.textContent = pesanBerhasil;
      window.alert(pesanBerhasil);
      window.close();
    } else {
      statusEl.textContent =
        "Absensi gagal: " +
        (data.pesan || "Kesalahan tidak diketahui.");
    }

    btnMulai.textContent = "Scan Lagi";
  });

  btnMulai.addEventListener("click", mulaiScan);

  btnBerhenti.addEventListener("click", async function() {
    if (sedangMemproses) return;

    await hentikanScan();

    sedangMemproses = false;
    btnMulai.disabled = false;
    btnMulai.textContent = "Mulai Scan";
    statusEl.textContent = "Kamera dihentikan.";
  });
</script>
</body>
</html>
